name: RunT Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install ruff
    - name: pytest
      run: |
        pytest -v
    - name: ruff format
      run: |
        ruff format $(git ls-files '*.py')
